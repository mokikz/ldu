    <style>

    border: 1px solid black;

    outline: thin solid;
}

    cursor:pointer;
    background-color: #EEEEEE;
}

td.collapse {
  width: 2em;
  }

img {
  width: 1em;
  height: 1em;
}

table {
  width: 100%;
  font-size: 1em;
  border: 1px solid black;
  border-collapse: collapse;
  }

.headline {
    background-image: url(images/mokikz_256.png);
    background-repeat:no-repeat;
    background-position:left;
    background-size: 5em;
    padding-left: 5em;

  }

.modalOverlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;

  justify-content: center;

.modalOverlay.open {

  background: #fff;

.modalBox h2 {

}

}

.modalBox .checkboxGroup {
  margin-top: 0.4em;
  display: flex;
  gap: 1em;
  flex-wrap: wrap;
}

.modalBox .checkboxGroup label {
  display: inline;

}

<title>Lern die Uhr - Aufgaben anpassen</title>
<script src="/scripts/jquery-1.11.2.min.js"></script>
<script src="/scripts/js.cookie.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/scripts/data.js"></script>
<script type="application/x-javascript">
var isIE = /*@cc_on!@*/false || !!document.documentMode;
var allWorlds;
// Edge 20+
var isEdge = !isIE && !!window.StyleMedia;
</script>
</head>
<body onload="initialize()">
<header>
<div class='headline'>
  <h1>Lern die Uhr - Aufgaben bearbeiten</h1>
  <label for='dataFilePicker'>Datei: </label>
  <select id='dataFilePicker' onchange='switchDataFile(this.value)'></select>
  <button type='button' onclick='showNewFileDialog()'>Neue Datendatei anlegen</button>
  <button type='button' onclick='addWorld()'>Aufgabenblock hinzufügen</button>
  <button type='button' onclick='saveData()'>Aufgaben am Server speichern</button>
</div>
</header>
<div id="newFileDialog" class="modalOverlay">
  <div class="modalBox">
    <h2>Neue Datendatei anlegen</h2>
    <label for="newFileName">Dateiname (ohne .js)</label>
    <input type="text" id="newFileName" placeholder="z.B. klasse3" />
    <label for="newFileTemplate">Vorlage</label>
    <select id="newFileTemplate"></select>
    <div class="dialogButtons">
      <button type="button" onclick="cancelNewFile()">Abbrechen</button>
      <button type="button" onclick="createNewFile()">Speichern</button>
    </div>
  </div>
</div>

<div id="addWorldDialog" class="modalOverlay">
  <div class="modalBox">
    <h2>Aufgabenblock hinzuf&uuml;gen</h2>
    <label for="addWorldName">Name des Aufgabenblocks</label>
    <input type="text" id="addWorldName" placeholder="z.B. Viertelstunden" />
    <label for="addWorldType">Aufgabentyp</label>
    <select id="addWorldType"></select>
    <label>Klasse</label>
    <div class="checkboxGroup">
      <label><input type="checkbox" id="addWorldKlasse1" value="1"> Klasse 1</label>
      <label><input type="checkbox" id="addWorldKlasse2" value="2"> Klasse 2</label>
      <label><input type="checkbox" id="addWorldKlasse3" value="3"> Klasse 3</label>
      <label><input type="checkbox" id="addWorldKlasse4" value="4"> Klasse 4</label>
    </div>
    <label for="addWorldPosition">Einf&uuml;gen nach</label>
    <select id="addWorldPosition"></select>
    <div class="dialogButtons">
      <button type="button" onclick="cancelAddWorld()">Abbrechen</button>
      <button type="button" onclick="saveAddWorld()">Speichern</button>
    </div>
  </div>
</div>
<div>
<table id="AllWorlds">
</table>
</div>
<script type="application/x-javascript">
function getCookie(name) {
  var match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
  return match ? decodeURIComponent(match[1]) : null;
}

function switchDataFile(name) {
  document.cookie = 'klasse=' + encodeURIComponent(name) + '; path=/';
  location.reload();
}

function loadDataFileList() {
  var current = getCookie('klasse') || 'data';
  fetch('/api/data-files')
    .then(function(r) { return r.json(); })
    .then(function(files) {
      var select = document.getElementById('dataFilePicker');
      files.forEach(function(name) {
        var opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        if (name === current) opt.selected = true;
        select.appendChild(opt);
      });
    });
}

function initialize() {
  allWorlds = document.getElementById('AllWorlds');
  loadDataFileList();
  fillTable(allWorlds, levels);
  collapseAll($('#AllWorlds'));
  }

/*
    var levels = [
        {"world": "Start", 
         "levels": [
           {"label": "Stell die Uhr eine viertel Stunde zurück", startHour: 11, startMinute: 15, zielHour: "11", zielMinute: "00"},
*/
function levelRowContent(world, key) {
  var data = levels[world]['levels'][key];
  return '<td></td>' +
    '<td>' + data['label'] + '</td>' +
    '<td>' + data['startHour'] + ':' + data['startMinute'] + '</td>' +
    '<td>' + data['zielHour'] + ':' + data['zielMinute'] + '</td>' +
    '<td>' +
      "<img src='images/delete.png' onclick='deleteLevel(" + world + "," + key + ")' title='Aufgabe L\xf6schen'> " +
      "<button type='button' onclick='editLevel(" + world + "," + key + ")' title='Aufgabe bearbeiten'>&#9998;</button> " +
      "<button type='button' onclick='addLevel(" + world + "," + key + ")' title='Aufgabe darunter einf\xfcgen'>&#10010;</button>" +
    '</td>';
}

function editLevel(world, key) {
  var data = levels[world]['levels'][key];
  var row = document.getElementById('level_row_' + world + '_' + key);
  row.innerHTML =
    '<td></td>' +
    '<td><input id="el_label" type="text" style="width:100%" value="' + data['label'].replace(/"/g, '&quot;') + '"></td>' +
    '<td>' +
      '<input id="el_startHour" type="number" min="0" max="23" style="width:3.5em" value="' + data['startHour'] + '">:' +
      '<input id="el_startMinute" type="number" min="0" max="59" style="width:3.5em" value="' + data['startMinute'] + '">' +
    '</td>' +
    '<td>' +
      '<input id="el_zielHour" type="number" min="0" max="23" style="width:3.5em" value="' + data['zielHour'] + '">:' +
      '<input id="el_zielMinute" type="number" min="0" max="59" style="width:3.5em" value="' + data['zielMinute'] + '">' +
    '</td>' +
    '<td>' +
      "<button type='button' onclick='saveLevel(" + world + "," + key + ")'>&#10003; Speichern</button> " +
      "<button type='button' onclick='cancelEditLevel(" + world + "," + key + ")'>Abbrechen</button>" +
    '</td>';
}

function saveLevel(world, key) {
  levels[world]['levels'][key]['label']       = document.getElementById('el_label').value;
  levels[world]['levels'][key]['startHour']   = parseInt(document.getElementById('el_startHour').value, 10);
  levels[world]['levels'][key]['startMinute'] = parseInt(document.getElementById('el_startMinute').value, 10);
  levels[world]['levels'][key]['zielHour']    = parseInt(document.getElementById('el_zielHour').value, 10);
  levels[world]['levels'][key]['zielMinute']  = parseInt(document.getElementById('el_zielMinute').value, 10);
  document.getElementById('level_row_' + world + '_' + key).innerHTML = levelRowContent(world, key);
}

function cancelEditLevel(world, key) {
  document.getElementById('level_row_' + world + '_' + key).innerHTML = levelRowContent(world, key);
}

function deleteLevel(world, key) {
  levels[world]['levels'].splice(key, 1);
  redrawWorldLevels(world);
  }

function redrawWorldLevels(world) {
  var headerRow = $('#world_header_' + world);
  // Remember whether items are currently visible
  var firstItem = headerRow.nextUntil('.mainheader').filter('.item').first();
  var wasVisible = firstItem.length === 0 || firstItem.is(':visible');
  // Remove all existing level rows for this world
  headerRow.nextUntil('.mainheader').remove();
  // Generate and insert fresh rows
  var r = [];
  var j = -1;
  j = fillLevelRows(r, j, world, levels[world]['levels'], 'world_');
  headerRow.after(r.join(''));
  // Restore collapsed state if needed
  if (!wasVisible) {
    headerRow.nextUntil('.mainheader').filter('.item').hide();
  }
}

function addLevel(world, key) {
  var copy = JSON.parse(JSON.stringify(levels[world]['levels'][key]));
  levels[world]['levels'].splice(key + 1, 0, copy);
  redrawWorldLevels(world);
}

function fillLevelRows(r, j, world, data, id) {
  r[++j] ='<tr class="header item"><td/><td>Aufgabentext</td><td>Voreingestellte Zeit</td><td>Soll Zeit</td><td>Aktionen</td>';
  for (var key=0, size=data.length; key<size; key++){
    r[++j] = '<tr class="item" id="level_row_' + world + '_' + key + '">';
    r[++j] = levelRowContent(world, key);
    r[++j] = '</tr>';
    }
  return j;
  }

function fillClassColumn (klassen) {
  var s = klassen.join(', ');
  return s;
}

function fillTable(table, data) {
  var r = new Array(); 
  var j = -1;
  var levels = 0;
  var type = "";
  r[++j] = "<tr onclick='expandAll()' class='mainheader'><td class='collapse'><img src='images/expand.png' title='Alle Aufgaben anzeigen'></img></td><td colspan='2'>Name</td><td>Aufgaben</td><td>Aufgabentyp</td><td>Klasse</td></tr>";
  for (var key=0, size=data.length; key<size; key++){
    r[++j] ="<tr class='mainheader' id='world_header_" + key + "' onclick='expandChapter(this)'><td>";
    r[++j] = "<img src='images/expand.png' onclick='expandChapter(this)' title='Alle Aufgaben dieses Kapitels anzeigen'></img>";
    r[++j] = "</td><td colspan='2'>";
    r[++j] = data[key]['world'];
    r[++j] = '</td><td>';
    levels = data[key]["levels"];
    numOfLevels = levels.length;
    r[++j] = numOfLevels;
    r[++j] = '</td><td>';
    type = data[key]["type"];
    r[++j] = type;
    r[++j] = '</td><td>';
    r[++j] = fillClassColumn(data[key]['klasse']);
    r[++j] = '</td></tr>';
    j = fillLevelRows(r, j, key, levels, "world_");
    }
  $('#AllWorlds').html(r.join('')); 
  }

function showNewFileDialog() {
  fetch('/api/data-files')
    .then(function(r) { return r.json(); })
    .then(function(files) {
      var sel = document.getElementById('newFileTemplate');
      sel.innerHTML = '';
      files.forEach(function(name) {
        var opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        sel.appendChild(opt);
      });
      document.getElementById('newFileName').value = '';
      document.getElementById('newFileDialog').classList.add('open');
    });
  }

function cancelNewFile() {
  document.getElementById('newFileDialog').classList.remove('open');
  }

function createNewFile() {
  var name = document.getElementById('newFileName').value.trim();
  var template = document.getElementById('newFileTemplate').value;
  if (!name) {
    alert('Bitte einen Dateinamen eingeben.');
    return;
  }
  fetch('/api/create-data-file', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: name, template: template })
  })
  .then(function(r) { return r.json(); })
  .then(function(result) {
    if (result.ok) {
      cancelNewFile();
      switchDataFile(name);
    } else {
      alert('Fehler: ' + (result.error || 'Unbekannter Fehler'));
    }
  })
  .catch(function(e) { alert('Fehler: ' + e); });
  }

function addWorld() {
  // populate type select with unique types from current data
  var typeSel = document.getElementById('addWorldType');
  typeSel.innerHTML = '';
  var seen = {};
  for (var i = 0; i < levels.length; i++) {
    var t = levels[i]['type'];
    if (t && !seen[t]) {
      seen[t] = true;
      var tOpt = document.createElement('option');
      tOpt.value = t;
      tOpt.textContent = t;
      typeSel.appendChild(tOpt);
    }
  }
  // populate position select
  var posSel = document.getElementById('addWorldPosition');
  posSel.innerHTML = '<option value="-1">Am Anfang</option>';
  for (var j = 0; j < levels.length; j++) {
    var pOpt = document.createElement('option');
    pOpt.value = j;
    pOpt.textContent = 'Nach: ' + levels[j]['world'];
    if (j === levels.length - 1) pOpt.selected = true;
    posSel.appendChild(pOpt);
  }
  // reset other fields
  document.getElementById('addWorldName').value = '';
  [1,2,3,4].forEach(function(k) {
    document.getElementById('addWorldKlasse' + k).checked = false;
  });
  document.getElementById('addWorldDialog').classList.add('open');
  }

function cancelAddWorld() {
  document.getElementById('addWorldDialog').classList.remove('open');
  }

function saveAddWorld() {
  var name = document.getElementById('addWorldName').value.trim();
  var type = document.getElementById('addWorldType').value;
  var insertAfter = parseInt(document.getElementById('addWorldPosition').value, 10);
  if (!name) {
    alert('Bitte einen Namen eingeben.');
    return;
  }
  var klasse = [];
  [1,2,3,4].forEach(function(k) {
    if (document.getElementById('addWorldKlasse' + k).checked) klasse.push(k);
  });
  var newWorld = {
    world: name,
    klasse: klasse,
    type: type,
    levels: [
      { label: '', startHour: 0, startMinute: 0, zielHour: '0', zielMinute: '00' }
    ]
  };
  levels.splice(insertAfter + 1, 0, newWorld);
  cancelAddWorld();
  fillTable(allWorlds, levels);
  collapseAll($('#AllWorlds'));
  }

function saveData() {
  fetch('/api/save-data', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(levels)
  })
  .then(function(r) { return r.json(); })
  .then(function(result) {
    if (result.ok) {
      alert('Gespeichert!');
    } else {
      alert('Fehler: ' + (result.error || 'Unbekannter Fehler'));
    }
  })
  .catch(function(e) { alert('Fehler beim Speichern: ' + e); });
  }

function expandAll(element) {
  $("tr.item").each(function() {
  $this = $(this);
  $this.slideToggle();
  });
  }

function expandChapter(element) {
  $(element).nextUntil(".mainheader").each(function(){
    $this = $(this);
    $this.slideToggle();
    });
//.slideToggle(1000);
  }

function collapseAll(element) {
  $("tr.item").each(function() {
  $this = $(this);
  $this.slideToggle();
  });
  //$(element).nextUntil('tr.header').slideToggle(1000);
  }
</script>
</body>

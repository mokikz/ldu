<script type="application/x-javascript">
function getCookie(name) {
  var match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
  return match ? decodeURIComponent(match[1]) : null;
}

function switchDataFile(name) {
  document.cookie = 'klasse=' + encodeURIComponent(name) + '; path=/';
  location.reload();
}

function loadDataFileList() {
  var current = getCookie('klasse') || 'data';
  fetch('/api/data-files')
    .then(function(r) { return r.json(); })
    .then(function(files) {
      var select = document.getElementById('dataFilePicker');
      files.forEach(function(name) {
        var opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        if (name === current) opt.selected = true;
        select.appendChild(opt);
      });
    });
}

function setAvatarPreview(filename) {
  var img = document.getElementById('meta_avatar_preview');
  document.getElementById('meta_avatar').value = filename;
  if (filename) {
    img.src   = '/images/avatars/' + filename;
    img.style.display = 'inline';
  } else {
    img.src   = '';
    img.style.display = 'none';
  }
  }

function loadMetadata() {
  var m = (typeof metadata !== 'undefined' && metadata) ? metadata : {};
  document.getElementById('meta_school').value    = m.school    || '';
  document.getElementById('meta_teacher').value   = m.teacher   || '';
  document.getElementById('meta_className').value = m.className || '';
  setAvatarPreview(m.avatar || '');
  }

function readMetadata() {
  return {
    school:    document.getElementById('meta_school').value,
    teacher:   document.getElementById('meta_teacher').value,
    className: document.getElementById('meta_className').value,
    avatar:    document.getElementById('meta_avatar').value
  };
  }

function initialize() {
  allWorlds = document.getElementById('AllWorlds');
  loadDataFileList();
  loadMetadata();
  fillTable(allWorlds, levels);
  collapseAll($('#AllWorlds'));
  }

/*
    var levels = [
        {"world": "Start", 
         "levels": [
           {"label": "Stell die Uhr eine viertel Stunde zurück", startHour: 11, startMinute: 15, zielHour: "11", zielMinute: "00"},
*/
function levelRowContent(world, key) {
  var data = levels[world]['levels'][key];
  return '<td></td>' +
    '<td>' + data['label'] + '</td>' +
    '<td>' + data['startHour'] + ':' + data['startMinute'] + '</td>' +
    '<td>' + data['zielHour'] + ':' + data['zielMinute'] + '</td>' +
    '<td>' +
      "<img src='images/delete.png' onclick='deleteLevel(" + world + "," + key + ")' title='Aufgabe L\xf6schen'> " +
      "<button type='button' onclick='editLevel(" + world + "," + key + ")' title='Aufgabe bearbeiten'>&#9998;</button> " +
      "<button type='button' onclick='addLevel(" + world + "," + key + ")' title='Aufgabe darunter einf\xfcgen'>&#10010;</button>" +
    '</td>';
}

function editLevel(world, key) {
  var data = levels[world]['levels'][key];
  var row = document.getElementById('level_row_' + world + '_' + key);
  row.innerHTML =
    '<td></td>' +
    '<td><input id="el_label" type="text" style="width:100%" value="' + data['label'].replace(/"/g, '&quot;') + '"></td>' +
    '<td>' +
      '<input id="el_startHour" type="number" min="0" max="23" style="width:3.5em" value="' + data['startHour'] + '">:' +
      '<input id="el_startMinute" type="number" min="0" max="59" style="width:3.5em" value="' + data['startMinute'] + '">' +
    '</td>' +
    '<td>' +
      '<input id="el_zielHour" type="number" min="0" max="23" style="width:3.5em" value="' + data['zielHour'] + '">:' +
      '<input id="el_zielMinute" type="number" min="0" max="59" style="width:3.5em" value="' + data['zielMinute'] + '">' +
    '</td>' +
    '<td>' +
      "<button type='button' onclick='saveLevel(" + world + "," + key + ")'>&#10003; Speichern</button> " +
      "<button type='button' onclick='cancelEditLevel(" + world + "," + key + ")'>Abbrechen</button>" +
    '</td>';
}

function saveLevel(world, key) {
  levels[world]['levels'][key]['label']       = document.getElementById('el_label').value;
  levels[world]['levels'][key]['startHour']   = parseInt(document.getElementById('el_startHour').value, 10);
  levels[world]['levels'][key]['startMinute'] = parseInt(document.getElementById('el_startMinute').value, 10);
  levels[world]['levels'][key]['zielHour']    = parseInt(document.getElementById('el_zielHour').value, 10);
  levels[world]['levels'][key]['zielMinute']  = parseInt(document.getElementById('el_zielMinute').value, 10);
  document.getElementById('level_row_' + world + '_' + key).innerHTML = levelRowContent(world, key);
}

function cancelEditLevel(world, key) {
  document.getElementById('level_row_' + world + '_' + key).innerHTML = levelRowContent(world, key);
}

function deleteLevel(world, key) {
  levels[world]['levels'].splice(key, 1);
  redrawWorldLevels(world);
  }

function redrawWorldLevels(world) {
  var headerRow = $('#world_header_' + world);
  // Remember whether items are currently visible
  var firstItem = headerRow.nextUntil('.mainheader').filter('.item').first();
  var wasVisible = firstItem.length === 0 || firstItem.is(':visible');
  // Remove all existing level rows for this world
  headerRow.nextUntil('.mainheader').remove();
  // Generate and insert fresh rows
  var r = [];
  var j = -1;
  j = fillLevelRows(r, j, world, levels[world]['levels'], 'world_');
  headerRow.after(r.join(''));
  // Restore collapsed state if needed
  if (!wasVisible) {
    headerRow.nextUntil('.mainheader').filter('.item').hide();
  }
}

function addLevel(world, key) {
  var copy = JSON.parse(JSON.stringify(levels[world]['levels'][key]));
  levels[world]['levels'].splice(key + 1, 0, copy);
  redrawWorldLevels(world);
}

function fillLevelRows(r, j, world, data, id) {
  r[++j] ='<tr class="header item"><td/><td>Aufgabentext</td><td>Voreingestellte Zeit</td><td>Soll Zeit</td><td>Aktionen</td>';
  for (var key=0, size=data.length; key<size; key++){
    r[++j] = '<tr class="item" id="level_row_' + world + '_' + key + '">';
    r[++j] = levelRowContent(world, key);
    r[++j] = '</tr>';
    }
  return j;
  }

function fillClassColumn (klassen) {
  var s = klassen.join(', ');
  return s;
}

function fillTable(table, data) {
  var r = new Array(); 
  var j = -1;
  var levels = 0;
  var type = "";
  r[++j] = "<tr onclick='expandAll()' class='mainheader'><td class='collapse'><img src='images/expand.png' title='Alle Aufgaben anzeigen'></img></td><td colspan='2'>Name</td><td>Aufgaben</td><td>Aufgabentyp</td><td>Klasse</td></tr>";
  for (var key=0, size=data.length; key<size; key++){
    r[++j] ="<tr class='mainheader' id='world_header_" + key + "' onclick='expandChapter(this)'><td>";
    r[++j] = "<img src='images/expand.png' onclick='expandChapter(this)' title='Alle Aufgaben dieses Kapitels anzeigen'></img>";
    r[++j] = "</td><td colspan='2'>";
    r[++j] = data[key]['world'];
    r[++j] = '</td><td>';
    levels = data[key]["levels"];
    numOfLevels = levels.length;
    r[++j] = numOfLevels;
    r[++j] = '</td><td>';
    type = data[key]["type"];
    r[++j] = type;
    r[++j] = '</td><td>';
    r[++j] = fillClassColumn(data[key]['klasse']);
    r[++j] = '</td></tr>';
    j = fillLevelRows(r, j, key, levels, "world_");
    }
  $('#AllWorlds').html(r.join('')); 
  }

function nfdUpdateFilename() {
  var school = document.getElementById('nfd_school').value.trim();
  var cls    = document.getElementById('nfd_className').value.trim();
  var raw    = [school, cls].filter(Boolean).join(' ');
  var safe   = raw.replace(/[^a-zA-Z0-9_ -]/g, '').trim();
  if (safe) document.getElementById('newFileName').value = safe;
  }

function showNewFileDialog() {
  fetch('/api/data-files')
    .then(function(r) { return r.json(); })
    .then(function(files) {
      var sel = document.getElementById('newFileTemplate');
      sel.innerHTML = '';
      files.forEach(function(name) {
        var opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        sel.appendChild(opt);
      });
      ['nfd_school','nfd_teacher','nfd_className','newFileName'].forEach(function(id) {
        document.getElementById(id).value = '';
      });
      document.getElementById('nfd_avatar').value = '';
      var img = document.getElementById('nfd_avatar_preview');
      img.src = ''; img.style.display = 'none';
      document.getElementById('newFileDialog').classList.add('open');
    });
  }

function cancelNewFile() {
  document.getElementById('newFileDialog').classList.remove('open');
  }

function createNewFile() {
  var name = document.getElementById('newFileName').value.trim();
  var template = document.getElementById('newFileTemplate').value;
  if (!name) {
    alert('Bitte einen Dateinamen eingeben.');
    return;
  }
  var meta = {
    school:    document.getElementById('nfd_school').value,
    teacher:   document.getElementById('nfd_teacher').value,
    className: document.getElementById('nfd_className').value,
    avatar:    document.getElementById('nfd_avatar').value
  };
  fetch('/api/create-data-file', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: name, template: template, metadata: meta })
  })
  .then(function(r) { return r.json(); })
  .then(function(result) {
    if (result.ok) {
      cancelNewFile();
      switchDataFile(name);
    } else {
      alert('Fehler: ' + (result.error || 'Unbekannter Fehler'));
    }
  })
  .catch(function(e) { alert('Fehler: ' + e); });
  }

function addWorld() {
  // populate type select with unique types from current data
  var typeSel = document.getElementById('addWorldType');
  typeSel.innerHTML = '';
  var seen = {};
  for (var i = 0; i < levels.length; i++) {
    var t = levels[i]['type'];
    if (t && !seen[t]) {
      seen[t] = true;
      var tOpt = document.createElement('option');
      tOpt.value = t;
      tOpt.textContent = t;
      typeSel.appendChild(tOpt);
    }
  }
  // populate position select
  var posSel = document.getElementById('addWorldPosition');
  posSel.innerHTML = '<option value="-1">Am Anfang</option>';
  for (var j = 0; j < levels.length; j++) {
    var pOpt = document.createElement('option');
    pOpt.value = j;
    pOpt.textContent = 'Nach: ' + levels[j]['world'];
    if (j === levels.length - 1) pOpt.selected = true;
    posSel.appendChild(pOpt);
  }
  // reset other fields
  document.getElementById('addWorldName').value = '';
  [1,2,3,4].forEach(function(k) {
    document.getElementById('addWorldKlasse' + k).checked = false;
  });
  document.getElementById('addWorldDialog').classList.add('open');
  }

function cancelAddWorld() {
  document.getElementById('addWorldDialog').classList.remove('open');
  }

function saveAddWorld() {
  var name = document.getElementById('addWorldName').value.trim();
  var type = document.getElementById('addWorldType').value;
  var insertAfter = parseInt(document.getElementById('addWorldPosition').value, 10);
  if (!name) {
    alert('Bitte einen Namen eingeben.');
    return;
  }
  var klasse = [];
  [1,2,3,4].forEach(function(k) {
    if (document.getElementById('addWorldKlasse' + k).checked) klasse.push(k);
  });
  var newWorld = {
    world: name,
    klasse: klasse,
    type: type,
    levels: [
      { label: '', startHour: 0, startMinute: 0, zielHour: '0', zielMinute: '00' }
    ]
  };
  levels.splice(insertAfter + 1, 0, newWorld);
  cancelAddWorld();
  fillTable(allWorlds, levels);
  collapseAll($('#AllWorlds'));
  }

// ---- Avatar generator ----
var _avatarRng;

function _strHash(str) {
  var h = 0x811c9dc5;
  for (var i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 0x01000193) >>> 0;
  }
  return h || 0xDEADBEEF;
  }

function _makeRng(seed) {
  var s = seed >>> 0;
  return function() {
    s ^= s << 13; s ^= s >> 17; s ^= s << 5;
    return (s >>> 0) / 0x100000000;
  };
  }

function _hsl(h, s, l) { return 'hsl('+h+','+s+'%,'+l+'%)'; }

function _drawAvatar(canvas, rng) {
  var ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 100, 100);

  // Background
  var bgH = Math.floor(rng() * 360);
  var bgS = 55 + Math.floor(rng() * 35);
  var bgL = 55 + Math.floor(rng() * 20);
  ctx.fillStyle = _hsl(bgH, bgS, bgL);
  ctx.fillRect(0, 0, 100, 100);

  // Shape (contrasting hue, darker)
  var shH = (bgH + 150 + Math.floor(rng() * 60)) % 360;
  var shS = 55 + Math.floor(rng() * 30);
  var shL = 28 + Math.floor(rng() * 22);
  ctx.fillStyle = _hsl(shH, shS, shL);
  ctx.beginPath();
  var shape = Math.floor(rng() * 3);
  if (shape === 0) {           // circle
    ctx.arc(50, 50, 32, 0, Math.PI * 2);
  } else if (shape === 1) {    // triangle
    ctx.moveTo(50, 12); ctx.lineTo(84, 78); ctx.lineTo(16, 78);
    ctx.closePath();
  } else {                     // diamond
    ctx.moveTo(50, 13); ctx.lineTo(85, 50);
    ctx.lineTo(50, 87); ctx.lineTo(15, 50);
    ctx.closePath();
  }
  ctx.fill();

  // Decoration (sun / moon / star) in a light contrasting colour
  var dcH = (shH + 55 + Math.floor(rng() * 50)) % 360;
  ctx.fillStyle   = _hsl(dcH, 85, 82);
  ctx.strokeStyle = _hsl(dcH, 85, 82);
  ctx.lineWidth   = 2;
  var deco = Math.floor(rng() * 3);
  if (deco === 0) {            // sun: disc + 8 rays
    ctx.beginPath(); ctx.arc(50, 50, 8, 0, Math.PI * 2); ctx.fill();
    for (var i = 0; i < 8; i++) {
      var a = (i / 8) * Math.PI * 2 - Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(50 + Math.cos(a) * 12, 50 + Math.sin(a) * 12);
      ctx.lineTo(50 + Math.cos(a) * 18, 50 + Math.sin(a) * 18);
      ctx.stroke();
    }
  } else if (deco === 1) {     // moon: crescent
    ctx.beginPath(); ctx.arc(50, 50, 13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = _hsl(shH, shS, shL);  // cut out with shape colour
    ctx.beginPath(); ctx.arc(56, 44, 11, 0, Math.PI * 2); ctx.fill();
  } else {                     // star: 5-pointed
    ctx.beginPath();
    for (var j = 0; j < 10; j++) {
      var r   = j % 2 === 0 ? 14 : 6;
      var ang = (j * Math.PI / 5) - Math.PI / 2;
      if (j === 0) ctx.moveTo(50 + r * Math.cos(ang), 50 + r * Math.sin(ang));
      else         ctx.lineTo(50 + r * Math.cos(ang), 50 + r * Math.sin(ang));
    }
    ctx.closePath(); ctx.fill();
  }
  }

var _avatarSchoolId   = 'meta_school';
var _avatarClassId    = 'meta_className';
var _avatarCallback   = null;   // function(filename) called after save

function openAvatarGenerator(schoolInputId, classInputId, callback) {
  _avatarSchoolId = schoolInputId || 'meta_school';
  _avatarClassId  = classInputId  || 'meta_className';
  _avatarCallback = callback || function(filename) { setAvatarPreview(filename); };
  var school = document.getElementById(_avatarSchoolId).value.trim();
  var seed   = school ? _strHash(school) : Math.floor(Math.random() * 0x100000000);
  _avatarRng = _makeRng(seed);
  _drawAvatar(document.getElementById('avatarPreviewCanvas'), _avatarRng);
  document.getElementById('avatarDialog').classList.add('open');
  }

function openAvatarGeneratorForNewFile() {
  openAvatarGenerator('nfd_school', 'nfd_className', function(filename) {
    document.getElementById('nfd_avatar').value = filename;
    var img = document.getElementById('nfd_avatar_preview');
    img.src = '/images/avatars/' + filename;
    img.style.display = 'inline';
  });
  }

function regenerateAvatar() {
  _avatarRng = _makeRng(Math.floor(Math.random() * 0x100000000));
  _drawAvatar(document.getElementById('avatarPreviewCanvas'), _avatarRng);
  }

function cancelAvatarDialog() {
  document.getElementById('avatarDialog').classList.remove('open');
  }

function applyAvatar() {
  var school    = document.getElementById(_avatarSchoolId).value.trim();
  var className = document.getElementById(_avatarClassId).value.trim();
  var raw       = [school, className].filter(Boolean).join('_') || 'avatar';
  var safeName  = raw.replace(/[^a-zA-Z0-9_\- ]/g, '').trim() || 'avatar';
  var filename  = 'avatar_' + safeName + '.png';
  var dataUrl   = document.getElementById('avatarPreviewCanvas').toDataURL('image/png');
  fetch('/api/save-avatar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ filename: filename, dataUrl: dataUrl })
  })
  .then(function(r) { return r.json(); })
  .then(function(result) {
    if (result.ok) {
      _avatarCallback(result.filename);
      cancelAvatarDialog();
    } else {
      alert('Fehler: ' + (result.error || 'Unbekannter Fehler'));
    }
  })
  .catch(function(e) { alert('Fehler: ' + e); });
  }

function saveData() {
  fetch('/api/save-data', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ levels: levels, metadata: readMetadata() })
  })
  .then(function(r) { return r.json(); })
  .then(function(result) {
    if (result.ok) {
      alert('Gespeichert!');
    } else {
      alert('Fehler: ' + (result.error || 'Unbekannter Fehler'));
    }
  })
  .catch(function(e) { alert('Fehler beim Speichern: ' + e); });
  }
